plugins {
    id 'com.android.application'
}

android {
    namespace 'com.smk.princessmyra'
    compileSdk 34

    defaultConfig {
        applicationId "com.smk.princessmyra"
        minSdk 26
        targetSdk 34
        versionCode = Integer.parseInt(System.getenv("APP_VERSION_CODE") ?: "1")
        versionName = "1." + (System.getenv("APP_VERSION_CODE") ?: "0")
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("MYRUSH_KEYSTORE")
            if (ksPath != null && new File(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword System.getenv("MYRUSH_KEYSTORE_PASS")
                keyAlias "myrush"
                keyPassword System.getenv("MYRUSH_KEYSTORE_PASS")
                storeType "PKCS12"
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
