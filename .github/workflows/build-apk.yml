name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Put the game inside the app
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html

      - name: Unpack the signing key
        run: echo "${{ secrets.MYRUSH_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/myrush.p12"

      - name: Build the signed APK
        working-directory: android
        env:
          MYRUSH_KEYSTORE: ${{ runner.temp }}/myrush.p12
          MYRUSH_KEYSTORE_PASS: ${{ secrets.MYRUSH_KEYSTORE_PASS }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk MyRush.apk

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: MyRush-apk
          path: MyRush.apk

      - name: Publish the APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MyRush build ${{ github.run_number }}
          body: |
            Download MyRush.apk on the Android phone or tablet and open it to install.
            Android will ask you to allow installing from this source the first time.
            Installing a newer build over an older one keeps all progress. If you still have
            build 21 or older, uninstall it once before installing this build.
          files: MyRush.apk
