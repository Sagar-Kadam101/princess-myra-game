name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Put the game inside the app
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html

      - name: Unpack the signing key
        run: echo "${{ secrets.MYRUSH_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/myrush.p12"

      - name: Build the signed APK
        working-directory: android
        env:
          MYRUSH_KEYSTORE: ${{ runner.temp }}/myrush.p12
          MYRUSH_KEYSTORE_PASS: ${{ secrets.MYRUSH_KEYSTORE_PASS }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk MYRA.apk

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: MYRA-apk
          path: MYRA.apk

      - name: Publish the APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MYRA build ${{ github.run_number }}
          body: |
            **How to install MYRA on an Android phone or tablet**

            1. Tap MYRA.apk below. If Chrome warns "This file might be harmful", tap the arrow or "More" next to the warning and choose **Download anyway**. Chrome says this for every app that does not come from the Play Store.
            2. Open the downloaded file. If Android says installs from this source are not allowed, tap **Settings**, switch on **Allow from this source**, and go back.
            3. If Google Play Protect says "Unknown app", tap **More details**, then **Install anyway**. You can let it scan the app.
            4. Open MYRA. It works fully offline and sends nothing anywhere.

            Direct download of the newest version, for sharing: https://github.com/Sagar-Kadam101/princess-myra-game/releases/latest/download/MYRA.apk

            MYRA installs as its own app. If an older "Princess Myra" or "MyRush" app is on the phone it stays separate and can be uninstalled. From build 35 on, newer builds install over older ones and keep all progress.
          files: MYRA.apk
